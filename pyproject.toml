[project]
name = "voicenterprise"
version = "0.2.0"
description = "Voice-First Enterprise Knowledge Investigator (Retrieval, Grounded RAG, and Low-TTFA Voice Pipeline)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0.0",
    "fastembed>=0.4.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
